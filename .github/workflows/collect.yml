name: Collect tankers

on:
  schedule:
    - cron: "17 */3 * * *"      # every 3 hours, at 17 minutes past (UK time in winter)
  workflow_dispatch:            # adds a "Run workflow" button for testing

permissions:
  contents: write               # allows it to save tankers.json back into the repo

jobs:
  collect:
    runs-on: ubuntu-latest      # a fresh Linux computer from GitHub
    timeout-minutes: 20         # give up if something hangs

    steps:
      - name: Get the repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Listen for tankers
        run: python collect.py
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}   # the locked box from step 3

      - name: Save the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tankers.json history/
          git diff --staged --quiet || git commit -m "Update tankers ($(date -u +'%d %b %H:%M') UTC)"
          git push